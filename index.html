<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>客户快捷联系</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Tesseract.js OCR 引擎 —— 本地化（全部文件从 /vendor/ 加载，无任何 CDN 依赖） -->
    <script src="/vendor/tesseract.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <header class="header">
            <h1 class="header-title">客户快捷联系</h1>
            <button class="header-btn" id="configBtn" title="设置">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </header>

        <main class="main-content">
            <!-- 订单号输入 -->
            <section class="card">
                <div class="card-header">
                    <span class="card-icon">📋</span>
                    <span class="card-title">订单信息</span>
                </div>
                <div class="form-group">
                    <label for="orderNo">订单编号（可选）</label>
                    <input type="text" id="orderNo" placeholder="请输入订单编号，用于模板占位符替换">
                </div>
            </section>

            <!-- 手机号获取区域 -->
            <section class="card">
                <div class="card-header">
                    <span class="card-icon">📱</span>
                    <span class="card-title">手机号码</span>
                </div>

                <!-- 拍照识别区域 -->
                <div class="capture-area">
                    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;">
                    <button class="btn-photo" id="photoBtn">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <span>拍照识别</span>
                    </button>
                    <button class="btn-upload" id="uploadBtn" style="margin-left: 12px;">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span>上传图片</span>
                    </button>
                </div>

                <!-- 图片预览 -->
                <div class="preview-area" id="previewArea" style="display: none;">
                    <img id="previewImg" alt="预览图片">
                    <div class="preview-actions">
                        <button class="btn-text" id="retakeBtn">重新拍摄</button>
                        <button class="btn-text primary" id="recognizeBtn">识别号码</button>
                    </div>
                </div>

                <!-- 识别中提示 -->
                <div class="loading-area" id="loadingArea" style="display: none;">
                    <div class="spinner"></div>
                    <span>正在识别中...</span>
                </div>

                <!-- 手动输入 -->
                <div class="form-group phone-input-group">
                    <label for="phoneInput">手机号 <span class="required">*</span></label>
                    <div class="phone-input-wrapper">
                        <input type="tel" id="phoneInput" placeholder="请输入11位手机号码" maxlength="11">
                        <button class="btn-clear" id="clearPhoneBtn" style="display: none;" title="清空">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="15" y1="9" x2="9" y2="15"></line>
                                <line x1="9" y1="9" x2="15" y2="15"></line>
                            </svg>
                        </button>
                    </div>
                    <p class="tip-text" id="phoneTip"></p>
                </div>
            </section>

            <!-- 操作按钮区域 -->
            <section class="action-section">
                <!-- 主操作按钮：短信 + 微信 -->
                <div class="action-row primary-row">
                    <button class="action-btn sms-btn" id="smsBtn">
                        <div class="btn-icon-wrap">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                        <span class="btn-text-label">发送短信</span>
                        <span class="btn-sub-label">跳转短信应用</span>
                    </button>

                    <button class="action-btn wechat-btn" id="wechatBtn">
                        <div class="btn-icon-wrap">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                                <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.283-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/>
                            </svg>
                        </div>
                        <span class="btn-text-label">微信联系</span>
                        <span class="btn-sub-label">打开微信沟通</span>
                    </button>
                </div>

                <!-- 辅助操作按钮：复制 -->
                <div class="action-row secondary-row">
                    <button class="action-btn copy-btn" id="copyBtn">
                        <div class="btn-icon-wrap small">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </div>
                        <span class="btn-text-label">复制号码</span>
                    </button>
                </div>
            </section>

            <!-- 预览模板区域 -->
            <section class="card template-preview" id="templateSection" style="display: none;">
                <div class="card-header">
                    <span class="card-icon">📝</span>
                    <span class="card-title">消息预览</span>
                </div>
                <div class="template-tabs">
                    <button class="tab-btn active" data-tab="sms">短信模板</button>
                    <button class="tab-btn" data-tab="wechat">微信模板</button>
                    <button class="tab-btn" data-tab="verify">验证消息</button>
                </div>
                <div class="template-content">
                    <div class="template-item active" id="tpl-sms">
                        <p class="template-text" id="smsTemplatePreview"></p>
                    </div>
                    <div class="template-item" id="tpl-wechat">
                        <p class="template-text" id="wechatTemplatePreview"></p>
                    </div>
                    <div class="template-item" id="tpl-verify">
                        <p class="template-text" id="verifyTemplatePreview"></p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Toast提示 -->
        <div class="toast" id="toast"></div>

        <!-- 确认弹窗 -->
        <div class="modal-mask" id="modalMask" style="display: none;">
            <div class="modal">
                <div class="modal-header" id="modalTitle">提示</div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer">
                    <button class="modal-btn cancel" id="modalCancel">取消</button>
                    <button class="modal-btn confirm" id="modalConfirm">确定</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
