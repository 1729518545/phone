# Nginx 反向代理配置（可选，用于绑定域名 + HTTPS）
# 使用方法：
# 1. sudo cp nginx.conf /etc/nginx/sites-available/phone
# 2. sudo ln -s /etc/nginx/sites-available/phone /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. 替换 your-domain.com 为实际域名

server {
    listen 80;
    server_name your-domain.com;

    # 静态文件
    location / {
        root /opt/phone/dist;
        try_files $uri $uri/ /index.html;
    }

    # OCR API 反向代理到 Node.js 服务
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OCR 可能需要 30 秒
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm)$ {
        root /opt/phone/dist;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # tessdata 和 vendor 不缓存（确保更新生效）
    location /tessdata/ {
        root /opt/phone/dist;
        add_header Cache-Control "no-cache";
    }
    location /vendor/ {
        root /opt/phone/dist;
        add_header Cache-Control "no-cache";
    }
}
